add_newline = false

# A minimal left prompt
format = """$python$directory$character"""

# move the rest of the prompt to the right
#right_format = """$status$git_branch${custom.git_status_dirty}$git_status"""
right_format = """$status$cmd_duration$git_branch$git_status${custom.git_status_dirty}"""

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 2000

# Set the palette.
palette = "blue_matrix"

[profiles]
transient = '$time[❯](bold cyan) '
transient_success = '$time[❯](bold green) '
transient_error = '$status'

# Define custom colors
[palettes.tokyo_night]
black = '#15161e'
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
purple = '#bb9af7'
red = '#f7768e'
white = '#a9b1d6'
yellow = '#e0af68'
pink = '#ff6ac1'

[palettes.wombat]
black = '#000000'
red = '#ff615a'
green = '#b1e969'
yellow = '#ebd99c'
blue = '#5da9f6'
purple = '#e86aff'
cyan = '#82fff7'
white = '#dedacf'

[palettes.blue_matrix]
black = '#101116'
red = '#ff5680'
green = '#00ff9c'
yellow = '#fffc58'
blue = '#00b0ff'
purple = '#d57bff'
cyan = '#76c1ff'
white = '#c7c7c7'
brblack = '#686868'
brred = '#ff6e67'
brgreen = '#5ffa68'
bryellow = '#fffc67'
brblue = '#6871ff'
brpurple = '#d682ec'
brcyan = '#60fdff'
brwhite = '#ffffff'
background = '#101116'
foreground = '#00a2ff'
cursor-color = '#76ff9f'
cursor-text = '#a6a6a6'
selection-background = '#c1deff'
selection-foreground = '#000000'

# Ported from .p10k.zsh. p10k stores xterm-256 indices; hex is the exact
# equivalent, with the source index in the comment.
[palettes.p10k]
black = '#000000'   # POWERLEVEL9K_BACKGROUND (transparent)
blue = '#0087af'    # 31  dir
cyan = '#00afaf'    # 37  virtualenv, pyenv
green = '#5fd700'   # 76  prompt_char ok, vcs clean
purple = '#af5fff'  # 135 per_directory_history local
red = '#d70000'     # 160 status error
white = '#8787af'   # 103 dir shortened
yellow = '#d7af00'  # 178 vcs modified
# extras with no standard-name slot
anchor = '#00afff'  # 39  dir anchor
duration = '#87875f' # 101 command_execution_time
pink = '#ff5f87'    # 204 prompt_char error
status_ok = '#5faf00' # 70  status ok
time = '#5f8787'    # 66  time
muted = '#6c6c6c'   # 242 ruler, prompt gap

[character]
success_symbol = "[❯](purple)[❯](cyan)"
error_symbol = "[❯](yellow)[❯](red)"
vicmd_symbol = "[❮](purple)[❮](cyan)"

[python]
format = '[(\($virtualenv\) )]($style)'
style = 'white'

[directory]
style = "blue"
truncation_length = 1
truncation_symbol = ""
fish_style_pwd_dir_length = 1

# right prompt uses left space padding
[git_branch]
format = ' [$branch]($style)'
style = 'green'

[git_status]
format = '([\[$ahead_behind$stashed\]]($style))'
style = "cyan"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[custom.git_status_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
symbol = "•"
style = "yellow"
format="[$symbol]($style)"
shell = ["sh"]

[cmd_duration]
format = ' [$duration]($style)'

[line_break]
disabled = true

[shell]
fish_indicator = '🐟'
powershell_indicator = '_'
pwsh_indicator = '_'
zsh_indicator = '󠀥%'
style = 'cyan bold'
disabled = false

[status]
disabled = false
pipestatus = true
format = '[($symbol$int)]($style)'
symbol = '✘'
pipestatus_format = '\[$pipestatus\]($style)'

[time]
disabled = false
format = '[$time]($style) '
time_format = '%H:%M:%S'
style = 'yellow'
